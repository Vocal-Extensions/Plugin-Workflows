on:
  workflow_call:
    secrets:
      token:
        required: true

jobs:
  labels:
    runs-on: ubuntu-latest

    steps:
      - uses: EndBug/label-sync@v2.3.3
        with:
          config-file: https://raw.githubusercontent.com/Vocal-Extensions/Plugin-Workflows/main/.github/plugin-repo-labels.yaml
          delete-other-labels: true
          token: ${{ secrets.token }}